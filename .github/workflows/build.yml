name: Build

on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:

# 最小权限：默认只读，发布 job 单独提权
permissions:
  contents: read

env:
  # OMR 引擎版本：src-tauri/resources/engine 由 CI 从 Audiveris 官方 Release 拉取（185MB，不入库）
  AUDIVERIS_VERSION: "5.11.0"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    # macos-14 镜像已退役（解析到 macos-14-arm64-us-default 不被支持）
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Restore Audiveris engine cache
        uses: actions/cache@v4
        with:
          path: src-tauri/resources/engine
          key: engine-${{ env.AUDIVERIS_VERSION }}-macos-arm64
      - name: Fetch Audiveris engine + tessdata
        run: |
          set -e
          DEST=src-tauri/resources/engine
          mkdir -p "$DEST/tessdata"
          # GitHub Releases 大文件会被中途 reset（curl 56），--retry 不覆盖该错误码：
          # 用 --retry-all-errors + 断点续传 + 外层循环兜底
          fetch() {
            for i in 1 2 3 4 5; do
              curl -fL --retry 5 --retry-all-errors --retry-delay 5 -C - -o "$2" "$1" && return 0
              echo "download attempt $i failed, retrying in 15s..."
              sleep 15
            done
            return 1
          }
          if [ ! -f "$DEST/Audiveris.app/Contents/MacOS/Audiveris" ]; then
            fetch "https://github.com/Audiveris/audiveris/releases/download/${AUDIVERIS_VERSION}/Audiveris-${AUDIVERIS_VERSION}-macosx-arm64.dmg" \
              "$RUNNER_TEMP/audiveris.dmg"
            # 不加 -quiet：AGPL 许可交互需要 yes | 正常喂入（见 AGENTS.md）
            yes | hdiutil attach "$RUNNER_TEMP/audiveris.dmg" -nobrowse
            APP_SRC=$(ls -d /Volumes/*/Audiveris.app | head -1)
            cp -R "$APP_SRC" "$DEST/"
            hdiutil detach "$(dirname "$APP_SRC")" || true
          fi
          if [ ! -f "$DEST/tessdata/eng.traineddata" ]; then
            # tessdata 主仓库 = legacy + LSTM 合包（tessdata_best/fast 纯 LSTM 会 OCR 静默失效）
            fetch "https://github.com/tesseract-ocr/tessdata/raw/main/eng.traineddata" \
              "$DEST/tessdata/eng.traineddata"
          fi
      - run: npm ci
      - name: Build app
        shell: bash
        run: |
          set -eo pipefail
          npm run tauri build 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Build log tail (debug)
        if: failure()
        shell: bash
        run: |
          [ -f "$RUNNER_TEMP/build.log" ] || exit 0
          { echo "### tauri build tail (macos)"
            echo '```'
            tail -n 80 "$RUNNER_TEMP/build.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ScanScore-macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # 实验性：Windows 构建（签名未配置）；contents:write 供失败时提交日志到 ci-debug 分支
  build-windows:
    runs-on: windows-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Restore Audiveris engine cache
        uses: actions/cache@v4
        with:
          path: src-tauri/resources/engine
          key: engine-${{ env.AUDIVERIS_VERSION }}-windows-x64
      - name: Fetch Audiveris engine + tessdata
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ver = $env:AUDIVERIS_VERSION
          $dest = "src-tauri/resources/engine"
          New-Item -ItemType Directory -Force -Path "$dest/tessdata" | Out-Null
          # 同 macOS：--retry-all-errors + 断点续传 + 外层循环
          function Fetch($url, $out) {
            for ($i = 1; $i -le 5; $i++) {
              curl.exe -fL --retry 5 --retry-all-errors --retry-delay 5 -C - -o $out $url
              if ($LASTEXITCODE -eq 0) { return }
              Write-Host "download attempt $i failed, retrying in 15s..."
              Start-Sleep -Seconds 15
            }
            throw "download failed: $url"
          }
          if (-not (Test-Path "$dest/bin/Audiveris.exe")) {
            $msi = Join-Path $env:RUNNER_TEMP "audiveris.msi"
            Fetch "https://github.com/Audiveris/audiveris/releases/download/$ver/Audiveris-$ver-windows-x86_64.msi" $msi
            # msi 管理提取（不实际安装）：TARGETDIR 必须反斜杠+尾反斜杠；
            # 不加引号——尾反斜杠会转义收尾引号（RUNNER_TEMP 路径无空格，安全）
            $target = (Join-Path $env:RUNNER_TEMP "eng_extract") + "\"
            $p = Start-Process msiexec.exe -ArgumentList "/a", "`"$msi`"", "/qn", "/norestart", "TARGETDIR=$target" -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "msiexec /a failed with exit code $($p.ExitCode)" }
            $exe = Get-ChildItem -Path $target -Recurse -Filter Audiveris.exe | Select-Object -First 1
            if (-not $exe) { throw "msi 管理提取中未找到 Audiveris.exe" }
            $appRoot = $exe.Directory.Parent.FullName
            Copy-Item -Path "$appRoot/*" -Destination $dest -Recurse -Force
          }
          if (-not (Test-Path "$dest/tessdata/eng.traineddata")) {
            Fetch "https://github.com/tesseract-ocr/tessdata/raw/main/eng.traineddata" "$dest/tessdata/eng.traineddata"
          }
      - run: npm ci
      - name: Build app
        shell: bash
        run: |
          set -eo pipefail
          npm run tauri build 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Build log tail (debug)
        if: failure()
        shell: bash
        run: |
          [ -f "$RUNNER_TEMP/build.log" ] || exit 0
          { echo "### tauri build tail (windows)"
            echo '```'
            tail -n 80 "$RUNNER_TEMP/build.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish build log tail
        if: failure()
        shell: bash
        run: |
          [ -f "$RUNNER_TEMP/build.log" ] || exit 0
          # tail 传公共 paste，URL 通过 error 注解带回（注解公开 API 可读，不依赖 gh 登录）
          URL=$(tail -n 250 "$RUNNER_TEMP/build.log" | curl -s --max-time 60 --data-binary @- "https://paste.rs")
          echo "::error::BUILD_LOG_TAIL_URL=$URL"
          URL2=$(tail -n 2000 "$RUNNER_TEMP/build.log" | curl -s --max-time 60 --data-binary @- "https://0x0.st")
          echo "::error::BUILD_LOG_FULL_URL=$URL2"
      - uses: actions/upload-artifact@v4
        with:
          name: ScanScore-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

  # 打 tag 时：下载双平台产物 → 创建 GitHub Release 并附上安装包
  release:
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "ScanScore ${GITHUB_REF_NAME}" \
            --generate-notes
