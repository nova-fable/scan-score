name: Release Retry

# 补救通道：Build 工作流在 tag 上创建 Release 失败时，用本工作流按 tag 的 Build 产物补建。
# Release 建成后幂等退出（已存在 → no-op）。

on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-retry.yml']
    tags: ['v*']
  # Build 跑完后自动兜底一次：tag 触发的本工作流会与 Build 并发，
  # 那时还没有成功的 Build run（见下方守卫），真正兜底靠这个事件
  workflow_run:
    workflows: [Build]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create release for latest v* tag from its Build run artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG=$(gh api "repos/$REPO/git/matching-refs/tags/v" --jq '.[-1].ref' | sed 's|refs/tags/||')
          echo "tag: $TAG"
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists — nothing to do."
            exit 0
          fi

          # 必须拿到**这个 tag 的** Build run。RUN_ID 为空时 `gh run download ""`
          # 会拉到别的 run 的产物——曾把 0.3.0 的安装包发成了 v0.4.0。
          # 注意不能只挑 conclusion==success：本工作流存在的场景就是 Build 整体失败
          # （通常只是 release job 失败，构建产物是好的），那种 run 的结论是 failure。
          RUN_ID=$(gh run list -R "$REPO" -w Build -b "$TAG" -L 20 \
            --json databaseId,conclusion \
            --jq '[.[] | select(.conclusion != "cancelled")][0].databaseId // empty')
          if [ -z "$RUN_ID" ]; then
            echo "::warning::tag $TAG 还没有可用的 Build run，先不建 Release（避免拉到别的版本产物）"
            exit 0
          fi
          echo "build run: $RUN_ID"

          rm -rf dist
          gh run download "$RUN_ID" -R "$REPO" -D dist
          find dist -type f

          # 产物里必须带版本号，否则说明拉错了 run
          VER="${TAG#v}"
          if ! find dist -type f -name "*$VER*" | grep -q .; then
            echo "::error::下载到的产物里没有版本号 $VER，拒绝发布："
            find dist -type f
            exit 1
          fi

          ASSETS=$(find dist -type f | tr '\n' ' ')
          if ! OUT=$(gh release create "$TAG" $ASSETS \
              --title "ScanScore $TAG" \
              --generate-notes -R "$REPO" 2>&1); then
            echo "::error::gh release create failed: ${OUT:0:900}"
            exit 1
          fi
          echo "created: $OUT"
